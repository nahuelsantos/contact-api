[provider.melee]
type = "smtp"
host = "mail-server"
port = 25
tls  = "none"

[defaults]
provider = "melee"

[site.example]
from    = "Example <noreply@example.com>"
to      = ["owner@example.com"]
origins = ["https://example.com"]

[site.example.form.contact]
subject = "New message from {{name}}"

[[site.example.form.contact.fields]]
name     = "name"
label    = "Name"
type     = "text"
required = true

[[site.example.form.contact.fields]]
name     = "email"
label    = "Email"
type     = "email"
required = true

[[site.example.form.contact.fields]]
name     = "subject"
label    = "Subject"
type     = "text"
required = true

[[site.example.form.contact.fields]]
name     = "message"
label    = "Message"
type     = "textarea"
required = true
