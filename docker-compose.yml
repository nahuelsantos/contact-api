version: '3.8'

services:
  contact-api:
    image: ghcr.io/nahuelsantos/contact-api:latest
    container_name: contact-api
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - CONFIG_FILE=/etc/contact-api/forms.toml
      - RESEND_API_KEY=${RESEND_API_KEY:-}
    volumes:
      - ./config/example.toml:/etc/contact-api/forms.toml:ro
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3002/healthz" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - mail-network

  # Optional SMTP server for development (comment out in production)
  mail-server:
    image: mailhog/mailhog:latest
    container_name: mail-server
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI
    networks:
      - mail-network

networks:
  mail-network:
    driver: bridge
